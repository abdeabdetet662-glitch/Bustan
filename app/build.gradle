plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bustan.game'
    compileSdk 35

    defaultConfig {
        applicationId "com.bustan.game"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file("../ummah-release.keystore")
            storePassword "ummah2026"
            keyAlias "ummah"
            keyPassword "ummah2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
